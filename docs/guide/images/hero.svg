<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 620" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">One owner with many accounts feeding one local ledger</title>
  <desc id="heroDesc">A central owner card connects to wallet, exchange, bank, credit-card and broker account folders. A report card at the bottom shows a tax report and evidence ZIP.</desc>
  <defs>
    <radialGradient id="heroGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#f7931a" stop-opacity=".34"/>
      <stop offset=".48" stop-color="#f7931a" stop-opacity=".08"/>
      <stop offset="1" stop-color="#f7931a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="tealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#14b8a6" stop-opacity=".2"/>
      <stop offset="1" stop-color="#14b8a6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ownerFill" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f5f1e8"/>
    </linearGradient>
    <filter id="heroShadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity=".28"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="8" flood-color="#000000" flood-opacity=".16"/>
    </filter>
    <pattern id="dotGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.4" fill="#ffffff" opacity=".18"/>
    </pattern>
  </defs>

  <circle cx="360" cy="300" r="310" fill="url(#heroGlow)"/>
  <circle cx="600" cy="440" r="190" fill="url(#tealGlow)"/>
  <rect x="18" y="18" width="684" height="584" rx="34" fill="url(#dotGrid)" opacity=".5"/>

  <!-- connectors -->
  <g fill="none" stroke="#ffffff" stroke-opacity=".3" stroke-width="1.6" stroke-dasharray="5 8">
    <path d="M360 150 C308 176 232 180 158 202"/>
    <path d="M360 150 C412 176 488 180 562 202"/>
    <path d="M330 150 C258 198 170 248 140 326"/>
    <path d="M390 150 C462 198 550 248 580 326"/>
    <path d="M360 150 L360 318"/>
  </g>

  <!-- owner -->
  <g filter="url(#heroShadow)">
    <rect x="222" y="42" width="276" height="118" rx="24" fill="url(#ownerFill)"/>
    <rect x="222.75" y="42.75" width="274.5" height="116.5" rx="23.25" fill="none" stroke="#ffffff" stroke-opacity=".7"/>
    <circle cx="279" cy="101" r="29" fill="#0b1220"/>
    <path d="M269 94h14a8 8 0 0 1 0 16h-14zm0 8h17m-17 0v9h16a8 8 0 0 0 0-16" fill="none" stroke="#f7931a" stroke-width="2.2" stroke-linecap="round"/>
    <text x="322" y="91" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="22" font-weight="750" fill="#11161c">One owner</text>
    <text x="322" y="114" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="14" fill="#616b76">one tax subject · one input tree</text>
    <rect x="322" y="125" width="112" height="23" rx="11.5" fill="#fff1dc"/>
    <text x="334" y="140.5" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" font-weight="700" fill="#9a4d06">accounts/</text>
  </g>

  <!-- account chips -->
  <g filter="url(#softShadow)">
    <rect x="34" y="180" width="242" height="86" rx="19" fill="#ffffff"/>
    <rect x="50" y="196" width="38" height="38" rx="12" fill="#fff1dc"/>
    <text x="60" y="222" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="800" fill="#b45309">₿</text>
    <text x="100" y="210" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="16" font-weight="750" fill="#11161c">Ledger main</text>
    <text x="100" y="231" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#616b76">wallet · 2.49 BTC · watch-only</text>
    <rect x="100" y="241" width="110" height="8" rx="4" fill="#f0ece4"/>
    <rect x="100" y="241" width="78" height="8" rx="4" fill="#f7931a"/>
  </g>
  <g filter="url(#softShadow)">
    <rect x="444" y="180" width="242" height="86" rx="19" fill="#ffffff"/>
    <rect x="460" y="196" width="38" height="38" rx="12" fill="#e9efff"/>
    <text x="470" y="222" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="800" fill="#1d4ed8">⇄</text>
    <text x="510" y="210" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="16" font-weight="750" fill="#11161c">Kraken</text>
    <text x="510" y="231" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#616b76">exchange · ledgers + trades</text>
    <rect x="510" y="241" width="110" height="8" rx="4" fill="#f0ece4"/>
    <rect x="510" y="241" width="54" height="8" rx="4" fill="#1d4ed8"/>
  </g>
  <g filter="url(#softShadow)">
    <rect x="34" y="298" width="242" height="86" rx="19" fill="#ffffff"/>
    <rect x="50" y="314" width="38" height="38" rx="12" fill="#e2f5f0"/>
    <text x="61" y="340" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="800" fill="#0f766e">€</text>
    <text x="100" y="328" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="16" font-weight="750" fill="#11161c">KBC checking</text>
    <text x="100" y="349" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#616b76">bank · statements auto-found</text>
    <rect x="100" y="359" width="110" height="8" rx="4" fill="#f0ece4"/>
    <rect x="100" y="359" width="92" height="8" rx="4" fill="#0f766e"/>
  </g>
  <g filter="url(#softShadow)">
    <rect x="444" y="298" width="242" height="86" rx="19" fill="#ffffff"/>
    <rect x="460" y="314" width="38" height="38" rx="12" fill="#fee9e7"/>
    <text x="470" y="340" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="800" fill="#b42318">▭</text>
    <text x="510" y="328" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="16" font-weight="750" fill="#11161c">KBC Visa</text>
    <text x="510" y="349" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#616b76">credit card · a liability</text>
    <rect x="510" y="359" width="110" height="8" rx="4" fill="#f0ece4"/>
    <rect x="510" y="359" width="35" height="8" rx="4" fill="#b42318"/>
  </g>
  <g filter="url(#softShadow)">
    <rect x="252" y="306" width="216" height="66" rx="19" fill="#ffffff"/>
    <rect x="266" y="319" width="34" height="34" rx="11" fill="#e5f7ed"/>
    <text x="276" y="343" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="17" font-weight="800" fill="#087443">↗</text>
    <text x="312" y="331" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="15" font-weight="750" fill="#11161c">DEGIRO</text>
    <text x="312" y="350" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#616b76">broker · informational only</text>
  </g>

  <!-- report card -->
  <g filter="url(#heroShadow)">
    <rect x="172" y="430" width="376" height="148" rx="24" fill="#ffffff"/>
    <text x="196" y="461" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="15" font-weight="750" fill="#11161c">One local ledger</text>
    <text x="196" y="481" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5" fill="#7a8491">reports/2023/</text>
    <g fill="#ece7dd">
      <rect x="196" y="498" width="108" height="10" rx="5"/>
      <rect x="196" y="516" width="156" height="10" rx="5"/>
      <rect x="196" y="534" width="92" height="10" rx="5"/>
    </g>
    <g fill="#f7931a">
      <rect x="196" y="498" width="74" height="10" rx="5"/>
      <rect x="196" y="516" width="122" height="10" rx="5"/>
      <rect x="196" y="534" width="58" height="10" rx="5"/>
    </g>
    <rect x="380" y="494" width="144" height="54" rx="14" fill="#f4f1eb"/>
    <path d="M394 536 L416 522 L432 528 L454 507 L474 514 L496 499" fill="none" stroke="#0f766e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="496" cy="499" r="4" fill="#0f766e"/>
    <rect x="380" y="558" width="144" height="1" fill="#e5dfd4"/>
    <rect x="196" y="560" width="133" height="24" rx="12" fill="#e5f7ed"/>
    <text x="209" y="576" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#087443">✓ evidence.zip</text>
    <text x="410" y="576" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="10.5" fill="#7a8491">static HTML · no cloud</text>
  </g>

  <!-- decorative coin -->
  <g transform="translate(624 86)" filter="url(#softShadow)">
    <circle r="34" fill="#f7931a"/>
    <circle r="28" fill="none" stroke="#ffffff" stroke-opacity=".55"/>
    <text y="11" text-anchor="middle" font-family="Georgia, serif" font-size="39" font-weight="700" fill="#ffffff">₿</text>
  </g>
</svg>
