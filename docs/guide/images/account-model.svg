<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 710" role="img" aria-labelledby="modelTitle modelDesc">
  <title id="modelTitle">One owner, five account kinds and one ownership registry</title>
  <desc id="modelDesc">A central owner connects to wallet, bank, credit-card, exchange and broker account folders. Descriptor-derived scripts establish ownership; BIP329 labels are display metadata only.</desc>
  <defs>
    <filter id="modelShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#11161c" flood-opacity=".09"/>
    </filter>
    <linearGradient id="modelOwner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1b2a40"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="710" rx="26" fill="#fbfaf7"/>
  <rect x="1" y="1" width="1198" height="708" rx="25" fill="none" stroke="#e5dfd4"/>

  <!-- owner -->
  <g filter="url(#modelShadow)">
    <rect x="414" y="32" width="372" height="104" rx="22" fill="url(#modelOwner)"/>
    <circle cx="470" cy="84" r="27" fill="#f7931a"/>
    <text x="470" y="93" text-anchor="middle" font-family="Georgia, serif" font-size="30" font-weight="700" fill="#ffffff">₿</text>
    <text x="514" y="76" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" font-weight="750" fill="#ffffff">One owner</text>
    <text x="514" y="99" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" fill="#b9c4d2">one taxpayer · one input tree · one local DB</text>
    <rect x="514" y="109" width="158" height="9" rx="4.5" fill="#ffffff" opacity=".1"/>
    <rect x="514" y="109" width="94" height="9" rx="4.5" fill="#f7931a"/>
  </g>

  <g fill="none" stroke="#c9c2b6" stroke-width="1.6" stroke-dasharray="5 7">
    <path d="M600 136 V166 H140 V208"/>
    <path d="M600 136 V166 H370 V208"/>
    <path d="M600 136 V208"/>
    <path d="M600 136 V166 H830 V208"/>
    <path d="M600 136 V166 H1060 V208"/>
  </g>

  <!-- account cards: 5 across -->
  <g filter="url(#modelShadow)">
    <rect x="33" y="208" width="214" height="160" rx="20" fill="#ffffff"/>
    <rect x="51" y="226" width="40" height="40" rx="13" fill="#fff1dc"/>
    <text x="63" y="254" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" font-weight="800" fill="#b45309">₿</text>
    <text x="103" y="243" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="16" font-weight="750" fill="#11161c">Wallet</text>
    <text x="103" y="262" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" fill="#616b76">on-chain ownership</text>
    <text x="51" y="294" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#3b4552">descriptor or xpub</text>
    <text x="51" y="312" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#3b4552">BIP329 labels.jsonl</text>
    <rect x="51" y="326" width="82" height="8" rx="4" fill="#f7931a" opacity=".22"/>
    <text x="51" y="349" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" fill="#9a4d06">accounts/ledger-main</text>
  </g>
  <g filter="url(#modelShadow)">
    <rect x="263" y="208" width="214" height="160" rx="20" fill="#ffffff"/>
    <rect x="281" y="226" width="40" height="40" rx="13" fill="#e2f5f0"/>
    <text x="293" y="254" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="800" fill="#0f766e">€</text>
    <text x="333" y="243" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="16" font-weight="750" fill="#11161c">Bank</text>
    <text x="333" y="262" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" fill="#616b76">fiat evidence</text>
    <text x="281" y="294" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#3b4552">statement CSV files</text>
    <text x="281" y="312" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#3b4552">EUR only · profile parser</text>
    <rect x="281" y="326" width="82" height="8" rx="4" fill="#0f766e" opacity=".2"/>
    <text x="281" y="349" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" fill="#0f766e">accounts/kbc-checking</text>
  </g>
  <g filter="url(#modelShadow)">
    <rect x="493" y="208" width="214" height="160" rx="20" fill="#ffffff"/>
    <rect x="511" y="226" width="40" height="40" rx="13" fill="#fee9e7"/>
    <text x="522" y="254" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="800" fill="#b42318">▭</text>
    <text x="563" y="243" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="16" font-weight="750" fill="#11161c">Credit card</text>
    <text x="563" y="262" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" fill="#616b76">a liability</text>
    <text x="511" y="294" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#3b4552">statement CSV files</text>
    <text x="511" y="312" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#3b4552">negative on overview</text>
    <rect x="511" y="326" width="82" height="8" rx="4" fill="#b42318" opacity=".18"/>
    <text x="511" y="349" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" fill="#b42318">accounts/kbc-visa</text>
  </g>
  <g filter="url(#modelShadow)">
    <rect x="723" y="208" width="214" height="160" rx="20" fill="#ffffff"/>
    <rect x="741" y="226" width="40" height="40" rx="13" fill="#e9efff"/>
    <text x="753" y="254" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="20" font-weight="800" fill="#1d4ed8">⇄</text>
    <text x="793" y="243" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="16" font-weight="750" fill="#11161c">Exchange</text>
    <text x="793" y="262" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" fill="#616b76">trades and flows</text>
    <text x="741" y="294" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#3b4552">Kraken ledgers + trades</text>
    <text x="741" y="312" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#3b4552">feeds the tax pool</text>
    <rect x="741" y="326" width="82" height="8" rx="4" fill="#1d4ed8" opacity=".16"/>
    <text x="741" y="349" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" fill="#1d4ed8">accounts/kraken</text>
  </g>
  <g filter="url(#modelShadow)">
    <rect x="953" y="208" width="214" height="160" rx="20" fill="#ffffff"/>
    <rect x="971" y="226" width="40" height="40" rx="13" fill="#e5f7ed"/>
    <text x="983" y="254" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="19" font-weight="800" fill="#087443">↗</text>
    <text x="1023" y="243" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="16" font-weight="750" fill="#11161c">Broker</text>
    <text x="1023" y="262" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" fill="#616b76">informational</text>
    <text x="971" y="294" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#3b4552">holdings + values</text>
    <text x="971" y="312" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#3b4552">not BTC tax math</text>
    <rect x="971" y="326" width="82" height="8" rx="4" fill="#087443" opacity=".16"/>
    <text x="971" y="349" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" fill="#087443">accounts/degiro</text>
  </g>

  <!-- lower explanation cards -->
  <g filter="url(#modelShadow)">
    <rect x="33" y="408" width="545" height="190" rx="22" fill="#ffffff"/>
    <rect x="55" y="430" width="118" height="24" rx="12" fill="#fff1dc"/>
    <text x="67" y="446" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11" font-weight="750" fill="#9a4d06">OWNERSHIP</text>
    <text x="55" y="479" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="750" fill="#11161c">Descriptors decide what is yours.</text>
    <text x="55" y="501" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" fill="#616b76">Scripts are derived, registered and matched per output.</text>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5">
      <rect x="55" y="519" width="128" height="34" rx="10" fill="#f4f1eb"/>
      <text x="67" y="540" fill="#3b4552">descriptor</text>
      <path d="M191 536 H221" stroke="#c9c2b6" stroke-width="1.5"/>
      <path d="M215 531 L222 536 L215 541" fill="none" stroke="#c9c2b6" stroke-width="1.5"/>
      <rect x="231" y="519" width="144" height="34" rx="10" fill="#f4f1eb"/>
      <text x="243" y="540" fill="#3b4552">account_scripts</text>
      <path d="M383 536 H413" stroke="#c9c2b6" stroke-width="1.5"/>
      <path d="M407 531 L414 536 L407 541" fill="none" stroke="#c9c2b6" stroke-width="1.5"/>
      <rect x="423" y="519" width="130" height="34" rx="10" fill="#fff1dc"/>
      <text x="435" y="540" fill="#9a4d06">output owner</text>
    </g>
    <text x="55" y="578" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#616b76">Duplicate scripts across accounts are a hard error, never a silent double count.</text>
    <rect x="55" y="588" width="13" height="4" rx="2" fill="#f7931a"/>
  </g>
  <g filter="url(#modelShadow)">
    <rect x="622" y="408" width="545" height="190" rx="22" fill="#ffffff"/>
    <rect x="644" y="430" width="148" height="24" rx="12" fill="#e2f5f0"/>
    <text x="656" y="446" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11" font-weight="750" fill="#0f766e">DISPLAY METADATA</text>
    <text x="644" y="479" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="18" font-weight="750" fill="#11161c">Labels explain, they never own.</text>
    <text x="644" y="501" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" fill="#616b76">BIP329 labels are scoped to an account and shown beside outputs.</text>
    <g font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11.5">
      <rect x="644" y="519" width="132" height="34" rx="10" fill="#f4f1eb"/>
      <text x="656" y="540" fill="#3b4552">labels.jsonl</text>
      <path d="M784 536 H814" stroke="#c9c2b6" stroke-width="1.5"/>
      <path d="M808 531 L815 536 L808 541" fill="none" stroke="#c9c2b6" stroke-width="1.5"/>
      <rect x="824" y="519" width="321" height="34" rx="10" fill="#e2f5f0"/>
      <text x="836" y="540" fill="#0f766e">UI only · never tax or ownership</text>
    </g>
    <text x="644" y="578" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#616b76">User labels survive re-imports; imported labels are replaced, not merged.</text>
    <rect x="644" y="588" width="13" height="4" rx="2" fill="#0f766e"/>
  </g>

  <rect x="33" y="626" width="1134" height="50" rx="14" fill="#0b1220"/>
  <text x="55" y="656" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" fill="#e6edf3"><tspan font-weight="750" fill="#f7931a">input/</tspan> stays read-only · every generated file lands under <tspan font-family="ui-monospace, SFMono-Regular, Consolas, monospace" fill="#ffffff">--data-dir</tspan> · no cloud, no seed phrases.</text>
  <text x="1145" y="656" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="11" fill="#7f8b9a">v8</text>
</svg>
