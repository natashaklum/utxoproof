<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="rollTitle rollDesc">
  <title id="rollTitle">A five-step pilot-before-bulk rollout ladder</title>
  <desc id="rollDesc">Pilot slice, validate, offline run, live sync and reconcile, then scale in rings. Every step is a checkpoint before adding more accounts.</desc>
  <defs>
    <filter id="rollShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#11161c" flood-opacity=".09"/>
    </filter>
    <linearGradient id="rollWarn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff2de"/>
      <stop offset="1" stop-color="#fff8ee"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="780" rx="26" fill="#fbfaf7"/>
  <rect x="1" y="1" width="1198" height="778" rx="25" fill="none" stroke="#e5dfd4"/>

  <text x="50" y="58" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="21" font-weight="750" fill="#11161c">Onboarding is a ladder, not a big-bang import.</text>
  <text x="50" y="84" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="13" fill="#616b76">Each rung is a checkpoint. Stop there until it passes; adding more accounts is cheap, untangling wrong numbers is not.</text>

  <!-- staircase -->
  <path d="M50 700 V630 H275 V550 H500 V470 H725 V390 H950 V310 H1155 V700 Z" fill="#efe9df" stroke="#ddd3c4" stroke-width="1.5"/>
  <g stroke="#d5c9b8" stroke-width="2">
    <path d="M50 630 H275"/>
    <path d="M275 550 H500"/>
    <path d="M500 470 H725"/>
    <path d="M725 390 H950"/>
    <path d="M950 310 H1155"/>
  </g>

  <!-- step 1 card -->
  <g filter="url(#rollShadow)">
    <rect x="50" y="454" width="205" height="156" rx="18" fill="#ffffff"/>
    <circle cx="74" cy="478" r="13" fill="#f7931a"/>
    <text x="74" y="483" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="800" fill="#0b1220">1</text>
    <text x="96" y="483" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="15" font-weight="750" fill="#11161c">Pilot slice</text>
    <text x="68" y="508" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#616b76">1 wallet · 1 exchange</text>
    <text x="68" y="525" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#616b76">1 statement · 1 tax year</text>
    <rect x="68" y="540" width="169" height="27" rx="8" fill="#f4f1eb"/>
    <text x="79" y="558" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" fill="#3b4552">~/utxoproof-pilot/</text>
    <rect x="68" y="578" width="169" height="20" rx="10" fill="#e5f7ed"/>
    <text x="79" y="592" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#087443">✓ tree loads</text>
  </g>

  <!-- step 2 card -->
  <g filter="url(#rollShadow)">
    <rect x="275" y="374" width="205" height="156" rx="18" fill="#ffffff"/>
    <circle cx="299" cy="398" r="13" fill="#cbd5e1"/>
    <text x="299" y="403" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="800" fill="#0b1220">2</text>
    <text x="321" y="403" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="15" font-weight="750" fill="#11161c">Validate</text>
    <text x="293" y="428" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#616b76">offline first, then ping</text>
    <text x="293" y="445" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#616b76">the chain backend</text>
    <rect x="293" y="460" width="169" height="27" rx="8" fill="#f4f1eb"/>
    <text x="304" y="478" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" fill="#3b4552">discover --online</text>
    <rect x="293" y="498" width="169" height="20" rx="10" fill="#e5f7ed"/>
    <text x="304" y="512" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#087443">✓ 0 errors · 0 collisions</text>
  </g>

  <!-- step 3 card -->
  <g filter="url(#rollShadow)">
    <rect x="500" y="294" width="205" height="156" rx="18" fill="#ffffff"/>
    <circle cx="524" cy="318" r="13" fill="#a7f3d0"/>
    <text x="524" y="323" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="800" fill="#0b1220">3</text>
    <text x="546" y="323" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="15" font-weight="750" fill="#11161c">Offline run</text>
    <text x="518" y="348" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#616b76">imports + report,</text>
    <text x="518" y="365" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#616b76">zero network calls</text>
    <rect x="518" y="380" width="169" height="27" rx="8" fill="#f4f1eb"/>
    <text x="529" y="398" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" fill="#3b4552">run --offline --no-zip</text>
    <rect x="518" y="418" width="169" height="20" rx="10" fill="#e5f7ed"/>
    <text x="529" y="432" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#087443">✓ numbers make sense</text>
  </g>

  <!-- step 4 card -->
  <g filter="url(#rollShadow)">
    <rect x="725" y="214" width="205" height="156" rx="18" fill="#ffffff"/>
    <circle cx="749" cy="238" r="13" fill="#93c5fd"/>
    <text x="749" y="243" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="800" fill="#0b1220">4</text>
    <text x="771" y="243" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="15" font-weight="750" fill="#11161c">Live sync</text>
    <text x="743" y="268" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#616b76">Electrum or Core,</text>
    <text x="743" y="285" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#616b76">then reconcile</text>
    <rect x="743" y="300" width="169" height="27" rx="8" fill="#f4f1eb"/>
    <text x="754" y="318" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" fill="#3b4552">run · reconcile --input</text>
    <rect x="743" y="338" width="169" height="20" rx="10" fill="#e5f7ed"/>
    <text x="754" y="352" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#087443">✓ reconciled · gap 0</text>
  </g>

  <!-- step 5 card -->
  <g filter="url(#rollShadow)">
    <rect x="950" y="134" width="205" height="156" rx="18" fill="#ffffff"/>
    <circle cx="974" cy="158" r="13" fill="#f7931a"/>
    <text x="974" y="163" text-anchor="middle" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12" font-weight="800" fill="#0b1220">5</text>
    <text x="996" y="163" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="15" font-weight="750" fill="#11161c">Scale in rings</text>
    <text x="968" y="188" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#616b76">add accounts, repeat</text>
    <text x="968" y="205" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="11.5" fill="#616b76">the same checkpoints</text>
    <rect x="968" y="220" width="169" height="27" rx="8" fill="#f4f1eb"/>
    <text x="979" y="238" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="9.5" fill="#3b4552">run --year YYYY</text>
    <rect x="968" y="258" width="169" height="20" rx="10" fill="#e5f7ed"/>
    <text x="979" y="272" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#087443">✓ filing-ready copy</text>
  </g>

  <!-- labels -->
  <rect x="50" y="708" width="92" height="24" rx="12" fill="#f7931a" opacity=".16"/>
  <text x="66" y="724" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="750" fill="#9a4d06">PILOT TREE</text>
  <rect x="1058" y="708" width="97" height="24" rx="12" fill="#0f766e" opacity=".14"/>
  <text x="1074" y="724" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="10.5" font-weight="750" fill="#0f766e">FULL TREE</text>

  <!-- warning strip -->
  <rect x="50" y="744" width="1105" height="1" fill="#e5dfd4"/>
  <text x="50" y="766" font-family="Inter, Segoe UI, system-ui, sans-serif" font-size="12.5" fill="#616b76">A failed checkpoint is cheap. A plausible-looking tax file built on an unvalidated tree is not.</text>
  <text x="1155" y="766" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="10.5" fill="#9a4d06">pilot → validate → sync → reconcile → scale</text>
</svg>
