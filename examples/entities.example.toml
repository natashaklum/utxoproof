# Example entity config for `utxoproof portfolio --entities this-file`.
# Copy next to your data dir and edit: every [[entities]] row is a wallet,
# bank account or exchange balance shown on the overview page.
#
#   cp examples/entities.example.toml ~/utxoproof-data/entities.toml
#
# What belongs here (and only here): human assertions the pipeline cannot
# derive — which wallet is savings vs spending, and euro balances with an
# as-of date in the note. What does NOT belong: secrets (no xpubs, keys or
# passwords — nothing reads secrets from this file), auto-derived balances
# from partial statements (a statement has no opening balance, so any amount
# without a human as-of note is a guess), or anything the tool computes
# itself (cost basis, gains, UTXO values).
#
# UTXO assignment: unspent outputs from the synced on-chain DB land in the
# entity whose `wallet` matches the synced wallet name (default
# `utxoproof_watchonly`, the same default as `setup`/`sync --wallet`). With a
# single [[entities]] entry everything lands there regardless of `wallet`.
#
# Validation: unknown entity_id in [[fiat]] aborts; `utxoproof portfolio`
# prints the resulting allocation so misassignment is visible immediately.

[[entities]]
id = "ledger-savings"
kind = "wallet"
label = "Ledger Nano — savings"
detail = "BIP84 account"
wallet = "utxoproof_watchonly"

# Second on-chain wallet: sync it via WALLETS="ledger-savings:AA:xpub…|phone:BB:xpub…"
# in run.sh (legacy XPUB/FINGERPRINT/WALLET synthesize one entry). Each unspent
# output lands in the entity whose `wallet` matches its attribution; a synced
# wallet with no entry here aborts the portfolio build naming it.
# [[entities]]
# id = "phone-spending"
# kind = "wallet"
# label = "Phone spending"
# detail = "Small hot wallet"
# wallet = "phone"

[[entities]]
id = "ing-savings"
kind = "bank"
label = "ING savings"
detail = "BE68 **** 7034"

[[entities]]
id = "kraken-eur"
kind = "exchange"
label = "Kraken EUR balance"
detail = "Uninvested euros"

# Static euro balances (no chain data needed). Assert them yourself from the
# account: as_of is machine-checked by `fiat-check` (stale/missing/future
# warns), note says where the figure came from. statements lists the
# evidencing files (relative to this file); entities without any warn as
# unverified.
[[fiat]]
entity_id = "ing-savings"
amount_eur = "12500"
note = "ING app balance, 2024-06-01"
as_of = "2024-06-01"

[[fiat]]
entity_id = "kraken-eur"
amount_eur = "3200"
note = "Dry powder"

# Your turn: a KBC checking account looks like this (uncomment + fill in).
# Convert the statement with:
#   utxoproof import --file ~/kbc-checking.csv --type kbc --out bank-rows.csv
# then review bank-rows.csv and attach the statement as a report --source.
# [[entities]]
# id = "kbc-checking"
# kind = "bank"
# label = "KBC checking"
# detail = "BE12 **** 3456"
# tags = ["bank-transfer"]
# [[fiat]]
# entity_id = "kbc-checking"
# amount_eur = "0"
# note = "KBC app balance, YYYY-MM-DD"
#
# Free tags: [entity_tags] assert tags per entity id, [utxo_tags] per
# "txid:vout" ref. Entity tags are inherited by every holding of that entity;
# UTXO tags attach to one output. Derived tags (behavior bucket, channel from
# acquisition source, "mixed") always apply first; yours extend them. Unknown
# entity ids abort; malformed UTXO refs abort.
# [entity_tags]
# ledger-savings = ["bank-transfer", "cold-storage"]
# [utxo_tags]
# "abc123def456:0" = ["cash", "gift"]