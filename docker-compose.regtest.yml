# Regtest stack for local development (Sprint 3 skeleton).
# bitcoind only; drive it with `utxoproof setup/sync --rpc-url
# http://127.0.0.1:18443 ...` or the regtest pytest marker.
# CI starts an equivalent container inline (see .github/workflows/ci.yml).
services:
  bitcoind:
    image: lncm/bitcoind:v25.1
    command:
      - -regtest=1
      - -server=1
      - -rpcuser=utxoproof
      - -rpcpassword=utxoproof-test
      - -rpcallowip=0.0.0.0/0
      - -rpcbind=0.0.0.0
      - -fallbackfee=0.0002
    ports:
      - "127.0.0.1:18443:18443"
    volumes:
      - bitcoind_regtest_data:/data/.bitcoin

  # Full-stack local use (uncomment to run utxoproof on the regtest network;
  # run `setup` first). RPC is passed as flags: there is no RPC env var.
  # utxoproof:
  #   build: .
  #   depends_on: [bitcoind]
  #   volumes:
  #     - ./utxoproof.toml:/app/utxoproof.toml:ro
  #     - utxoproof_regtest_data:/data
  #   environment:
  #     - UTXOPROOF_DATA_DIR=/data
  #   command:
  #     - sync
  #     - --rpc-url=http://bitcoind:18443
  #     - --rpc-user=utxoproof
  #     - --rpc-password=utxoproof-test
  #     - --wallet=cold

volumes:
  bitcoind_regtest_data:
  utxoproof_regtest_data:
