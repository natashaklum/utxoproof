[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "utxoproof"
version = "0.1.0"
description = "Bitcoin wealth management and compliance tool for Belgian self-custodians"
requires-python = ">=3.11"
dependencies = [
    # Sprint 0: rp2 only. Pinned to the exact commit checked in as the
    # vendor/rp2 submodule (reproducible installs without submodule init).
    # After changing vendor/rp2: commit+push there, then `git add vendor/rp2`
    # here and bump this SHA to match.
    "rp2 @ git+https://github.com/natashaklum/rp2.git@b1995bf1a07665035a46cf331cb06ccccd347ce2",
    "embit>=0.8",  # pure-python BIP32/39/descriptor crypto (no C toolchain)
    "httpx>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
utxoproof = "utxoproof.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["utxoproof"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["vendor"]

[tool.ruff.lint]
select = [
    "E", "F", "W",
    "I",
    "N",
    "UP",
    "S",
    "B",
    "C4",
    "DTZ",
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
warn_return_any = true

[[tool.mypy.overrides]]
module = ["embit.*", "markdown"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=utxoproof --cov-report=term-missing"
markers = [
    "regtest: needs a regtest bitcoind (skips without one)",
    "network: needs a public Electrum server (skips unless UTXOPROOF_LIVE_ELECTRUM=1)",
]
