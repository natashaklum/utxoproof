# Example utxoproof configuration. Copy to utxoproof.toml and edit.
# v8 installs put this file at input/utxoproof.toml next to accounts/.
# Legacy v7 commands can also read it from the working/data directory.

[owner]
# One taxpayer; account labels live in accounts/<id>/account.toml.
name = "self"

[chain]
# electrum (primary) or core (optional).
backend = "electrum"
network = "mainnet"
electrum_url = "ssl://127.0.0.1:50002"
# Path to the CA that signed your self-hosted Electrum certificate, if private.
electrum_ca_file = ""
# Core-only fallback:
rpc_url = "http://127.0.0.1:8332"
rpc_user = ""
rpc_password = ""
core_wallet = "utxoproof_watchonly"

[reporting]
# YYYY-MM-DD; empty means today (run) or the latest data year (report).
as_of = ""
tax_year = ""

[taxpayer]
reference = "BE-LOCAL"
# Communal surcharge (additional centimes): Brussels 0.0587, Ghent 0.076,
# Antwerp 0.08, Belgian average 0.07.
communal_surcharge_rate = 0.07

[accounting]
method = "moving_average"  # fifo | lifo | hifo | lofo | moving_average

[classifier]
speculator_threshold = 8
passive_threshold = 5
# Self-reported flags the classifier cannot detect from chain/exchange data.
used_leverage = false
used_derivatives = false
has_professional_crypto_income = false
# Estimated fraction of total declared income from BTC gains (0.0-1.0).
btc_income_fraction = 0.0
